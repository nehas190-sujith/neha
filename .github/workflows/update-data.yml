name: Refresh medicine shortage data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

jobs:
  refresh-data:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Med Intel ETL
        run: |
          python etl_tga.py

      - name: Validate generated dashboard files
        run: |
          test -f data/tga_tableau.csv
          test -f data/global_shortage_records.csv
          test -f data/global_shortage_trends.csv
          test -f data/global_source_summary.csv

          python - <<'PY'
          import pandas as pd

          files = {
              "TGA Tableau": "data/tga_tableau.csv",
              "Global records": "data/global_shortage_records.csv",
              "Global trends": "data/global_shortage_trends.csv",
              "Global summary": "data/global_source_summary.csv",
          }

          for label, path in files.items():
              df = pd.read_csv(path, low_memory=False)
              print(f"{label}: {len(df):,} rows")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/tga_current.csv \
            data/tga_tableau.csv \
            data/global_shortage_records.csv \
            data/global_shortage_trends.csv \
            data/global_source_summary.csv

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore: refresh medicine shortage data"
            git push
          fi
